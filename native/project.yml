# XcodeGen spec for the parallel native app.
#
# ── WHY THE PROJECT FILE IS GENERATED ────────────────────────────────────────
# A hand-edited `.pbxproj` costs this: a new .swift file that is not ticked
# into a target fails at LINK time with an error naming a symbol, not a file.
# That is a bad failure mode with four targets, so the project file is a build
# artefact here — regenerate it, never edit it, and never commit it.
#
#     brew install xcodegen
#     cd native && xcodegen generate && open Onyx.xcodeproj
#
# ── WHY THE BUNDLE ID ENDS IN `.native` ──────────────────────────────────────
# `app.onyx.health.michael.native` was chosen so this app could install
# ALONGSIDE the web-shell app it replaced. That app is gone; the id stays,
# because the App Store listing and every installed copy are keyed on it.

name: Onyx

options:
  bundleIdPrefix: app.onyx.health.michael
  deploymentTarget:
    iOS: "18.0"
    # Series 6 and SE 2 both run watchOS 11 and both ship a 40 mm case
    # (162 x 197 pt) — which is why every watch screen is budgeted for 40 mm
    # and not for the 41 mm this athlete happens to wear.
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  OnyxCore:
    path: Packages/OnyxCore
  OnyxData:
    path: Packages/OnyxData
  OnyxUI:
    path: Packages/OnyxUI

# ── VERSION ──────────────────────────────────────────────────────────────────
# WRITTEN BY `npm run version:sync` FROM package.json — do not hand-edit.
#
# Project-level, so the app, the widget extension and the watch app all carry
# the SAME numbers. They did not: the watch app had drifted to 1.1 while the
# phone it must pair with still said 1.0, and a watch app whose version does not
# match its companion is an upload the validator rejects.
#
# Every Info.plist below reads these through $(MARKETING_VERSION) /
# $(CURRENT_PROJECT_VERSION) rather than restating them.
settings:
  base:
    MARKETING_VERSION: "7.13.0"
    CURRENT_PROJECT_VERSION: "71300"

targets:
  Onyx:
    type: application
    platform: iOS

    sources:
      - path: Onyx
        excludes:
          # The example is documentation. The real one is gitignored and is
          # attached below as a config file, not compiled as a source.
          - "Support/Secrets.example.xcconfig"
          - "Support/Secrets.xcconfig"
          - "Support/Onyx.entitlements"
      # `Shared/` is in BOTH targets, and it has to be: ActivityKit matches the
      # app's `Activity.request` to the extension's `ActivityConfiguration` by
      # the ATTRIBUTES TYPE, and two identically-named structs compiled into two
      # modules are two different types. That failure does not break the build —
      # the activity starts and nothing draws.
      - path: Shared

    dependencies:
      - package: OnyxCore
        product: OnyxCore
      - package: OnyxData
        product: OnyxData
      - package: OnyxUI
        product: OnyxUI
      # Embedding the extension is what puts its `ActivityConfiguration` in the
      # app bundle. Without this the app can request an activity and the system
      # has nothing to draw it with.
      - target: OnyxWidgets
      # And the watch app, which XcodeGen embeds under `Watch/` for us. A watch
      # target that is not a dependency of its phone app builds and is never
      # installed on the wrist.
      - target: OnyxWatch

    # Secrets arrive as build settings and are surfaced through Info.plist, the
    # same convention the widget extension already uses for ONYX_SNAPSHOT_URL.
    configFiles:
      Debug: Onyx/Support/Secrets.xcconfig
      Release: Onyx/Support/Secrets.xcconfig

    # ── The App Group ────────────────────────────────────────────────────────
    # Gate 0 (§5.0): the shared container is where `onyx.sqlite` lives, so the
    # widget extension reads the SAME file the app writes — no snapshot route,
    # no token, no HTTP. Needs the paid Developer Program; a free personal team
    # cannot sign this entitlement, and `AppDatabase.sharedFolder()` falls back
    # to Application Support so the app still runs (widgets then stay empty).
    entitlements:
      path: Onyx/Support/Onyx.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.onyx.health
        # ── HealthKit ────────────────────────────────────────────────────────
        # Read access to the quantity types in `HealthCatalogue` plus sleep
        # analysis. This is the ONLY entitlement key standard read access needs:
        # `.access` is clinical records (none are requested) and
        # `.background-delivery` is for `enableBackgroundDelivery`, which is
        # never called. The two usage strings below are the other half —
        # `requestAuthorization` traps immediately without them.
        #
        # A personal team can provision HealthKit, but not the App Group above,
        # and Xcode refuses the profile for the target as a whole — so on-device
        # Health still waits on Gate 0 (buy the Developer Program).
        com.apple.developer.healthkit: true
        # ── Sign in with Apple — PARKED until Gate 0 ─────────────────────────
        # `com.apple.developer.applesignin: [Default]` belongs here, and is out
        # for exactly the reason `associated-domains` below is: a free Personal
        # Development Team cannot sign it and Xcode refuses the profile for the
        # target as a whole. W7 writes the Swift side against it; uncommenting
        # this one key and ticking "Sign In with Apple" on the App ID in the
        # portal is the entire remaining change.
        #
        # It becomes MANDATORY under 4.8 the moment Google sign-in ships — an
        # app offering a third-party login must offer Sign in with Apple beside
        # it. Both, or neither; never Google alone.
        # com.apple.developer.applesignin:
        #   - Default
        # ── HealthKit background delivery — PARKED until Gate 0 ──────────────
        # `enableBackgroundDelivery` needs this key, and the key needs the
        # HealthKit capability CONFIGURED on an explicit App ID in the portal,
        # which a personal team cannot do. Until then Health is pulled on
        # foreground (`HealthSync`) — correct, but not continuous.
        #
        # No `UIBackgroundModes` entry accompanies it. HealthKit background
        # delivery wakes the app through this entitlement alone; adding a
        # background mode here would be an unused capability and its own
        # rejection.
        # com.apple.developer.healthkit.background-delivery: true
        # ── Associated Domains — PARKED ──────────────────────────────────────
        # `com.apple.developer.associated-domains: [webcredentials:
        # <the OnyxLinks host>]` lived here and is temporarily out:
        # a free Personal Development Team cannot sign that entitlement, so
        # Xcode refuses the profile and the build fails at the signing step.
        # `site/.well-known/apple-app-site-association` still names this App
        # ID under `webcredentials`, so restoring the key is the only edit
        # needed once the paid Developer Program is in place (Gate 0). Until
        # then Password AutoFill just treats the app and the site as unrelated.

    info:
      path: Onyx/Support/Info.plist
      properties:
        CFBundleDisplayName: Onyx
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Dark only, matching the web app — which pins `defaultTheme="dark"` and
        # ships no toggle anywhere. A light palette is not a port, it is a design
        # project, and it is not in Wave 1.
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Live Activities are opt-in per app and this is the opt-in. Without it
        # `ActivityAuthorizationInfo().areActivitiesEnabled` is false forever
        # and the controller silently does nothing.
        NSSupportsLiveActivities: true
        # The rest clock keeps counting on the Lock Screen without the app being
        # woken, so no background mode is needed for it. `workout-processing`
        # arrives with the Watch in Wave 5.
        NSSupportsLiveActivitiesFrequentUpdates: false
        # ── Export compliance ────────────────────────────────────────────
        # App Store Connect asks this on EVERY upload and blocks the build in
        # "Missing Compliance" until it is answered. Declaring it here answers
        # it once, in the binary, so TestFlight never stalls waiting on a form.
        # `false` is the correct answer: the only cryptography in the app is
        # HTTPS to Supabase and the system Keychain, both of which are the
        # exemptions in Category 5 Part 2 — nothing here implements or bundles
        # its own encryption.
        ITSAppUsesNonExemptEncryption: false
        # ── Health permission copy ───────────────────────────────────────
        # Shown in the system sheet the first time `HealthSync` asks. App Review
        # rejects a generic string: it has to name the data and the purpose the
        # user gets out of it, so these list the actual categories read and what
        # the app computes from them.
        NSHealthShareUsageDescription: >-
          Onyx reads your activity, heart, sleep, body-measurement and
          nutrition data from Apple Health to work out your daily readiness and
          recovery scores, your training load and your energy balance, and to
          fill in the charts and Home Screen widgets. Nothing is read that you
          do not allow, and your data is stored only on this device and in your
          own private Onyx account.
        # Not written today — `HealthKitReader` requests `toShare: []`, and the
        # sheet only ever shows the half being asked for, so this string is
        # currently never displayed. It is declared ahead of the Watch client
        # (1.1), which saves its strength sessions back. Declaring it early
        # prevents no prompt (the WRITE prompt is triggered by a non-empty
        # `toShare:`, not by this key) — it just means the plist is already
        # right when that call lands.
        NSHealthUpdateUsageDescription: >-
          Onyx saves the strength workouts you log — their duration, active
          energy and heart rate — back to Apple Health, so the training you do
          here appears alongside the rest of your activity rings.
        # Substituted from Secrets.xcconfig at build time.
        ONYX_SUPABASE_URL: $(ONYX_SUPABASE_URL)
        ONYX_SUPABASE_ANON_KEY: $(ONYX_SUPABASE_ANON_KEY)
        # `onyx://open?path=/nutrition` — what every tile's `.widgetURL` opens.
        # Received by `.onOpenURL` in RootView through `DeepLink.safePath`, the
        # same allow-list the web app used.
        CFBundleURLTypes:
          - CFBundleURLName: app.onyx.health.michael.native
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - onyx
        # Required-reason API declaration lives in the privacy manifest, not
        # here — see PrivacyInfo.xcprivacy. The app it replaced was rejected-ready
        # without one for months; this target starts with it.

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.onyx.health.michael.native
        # The 1024×1024 mark from `Resources/Assets.xcassets`, written by
        # `npm run icons` from `resources/icon.png`. Without this the
        # target has no icon at all: a blank Home Screen tile, and an upload the
        # validator rejects for a missing marketing icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Automatic signing with the free personal team. The 7-day provisioning
        # expiry is a property of that team, not of this setting.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W9UMPV973P
        SWIFT_VERSION: "6.0"
        # Strict concurrency from day one. Retrofitting it later is the thing
        # that makes people abandon it.
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO

  # ── The widget extension ─────────────────────────────────────────────────
  #
  # Wave 5: the five Home Screen families (Fuel, Training, Body, Daily, Vitals),
  # the Lock Screen accessory and the running-workout Live Activity. The tiles
  # are `OnyxUI` views; the provider reads the App Group GRDB file through
  # OnyxData and never touches the network. `OnyxIntents` (the focus pickers)
  # came across intact.
  OnyxWidgets:
    type: app-extension
    platform: iOS

    sources:
      - path: OnyxWidgets
        excludes:
          - "Support/Info.plist"
          - "Support/OnyxWidgets.entitlements"
      - path: Shared

    dependencies:
      - package: OnyxCore
        product: OnyxCore
      # Read-only. `AppDatabase.readOnly(folderURL:)` opens the shared file
      # without running migrations — an extension that migrated would race the
      # app for the schema.
      - package: OnyxData
        product: OnyxData
      - package: OnyxUI
        product: OnyxUI

    entitlements:
      path: OnyxWidgets/Support/OnyxWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.onyx.health

    info:
      path: OnyxWidgets/Support/Info.plist
      properties:
        CFBundleDisplayName: Onyx Activity
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.onyx.health.michael.native.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W9UMPV973P
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # ── The Watch logging client (Wave 10) ───────────────────────────────────
  #
  # A SINGLE watchOS app target, not the old app-plus-extension pair: that
  # split died in watchOS 7 and `WKApplication: true` is what declares the
  # modern shape. The bundle id MUST be the phone's with `.watchkitapp`
  # appended — the pairing is by name, not by a setting, and a mismatch
  # installs an app that never sees its companion.
  #
  # It is a dependency of `Onyx` so XcodeGen writes the "Embed Watch Content"
  # phase. Without that the watch app builds, signs, and is never delivered to
  # the wrist.
  #
  # ── IT HAS ITS OWN STORE, AND IT HAS TO ──────────────────────────────────
  # An App Group is shared between processes on ONE device, so there is no
  # container the phone and the watch both see. `AppDatabase.sharedFolder()`
  # already answers Application Support when there is no container, which is
  # exactly right here: the watch runs the same migrations over its own
  # `onyx.sqlite` and is simply a second `device_id` in the same event log.
  OnyxWatch:
    type: application
    platform: watchOS

    sources:
      - path: OnyxWatch
        excludes:
          - "Support/Info.plist"
          - "Support/OnyxWatch.entitlements"

    dependencies:
      - package: OnyxCore
        product: OnyxCore
      - package: OnyxData
        product: OnyxData
      # Tokens, the type ramp, the springs, `LoggerSeams` — and since W7 the
      # accessory faces (`Accessory/`). Every Home Screen tile in this package
      # is still fenced `#if os(iOS)`.
      - package: OnyxUI
        product: OnyxUI
      # The complications. Embedded the way the phone embeds `OnyxWidgets`: a
      # widget extension that is not a dependency of its host builds and is
      # never on the watch face.
      - target: OnyxWatchWidgets

    # ── HealthKit ────────────────────────────────────────────────────────
    # `HKWorkoutSession` is the app's RUNTIME, not a heart-rate feature:
    # without one, watchOS suspends the app seconds after the wrist drops and
    # the rest haptic never fires. It needs this entitlement, the two usage
    # strings below, and `WKBackgroundModes: [workout-processing]`.
    entitlements:
      path: OnyxWatch/Support/OnyxWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        # ── The watch's own App Group (W7) ───────────────────────────────────
        # Shared with `OnyxWatchWidgets` below and nothing else: an App Group
        # is per DEVICE, so the phone's `group.app.onyx.health` is a different
        # container on a different chip. The watch app writes `WatchTiles`
        # (and the cached context) into this suite; the complication reads
        # them. Gate 0 applies here exactly as on the phone — a free team
        # cannot sign it, and the faces stay "—" on device until the founder
        # adds the capability in Xcode on both targets.
        com.apple.security.application-groups:
          - group.app.onyx.health.watch

    info:
      path: OnyxWatch/Support/Info.plist
      properties:
        CFBundleDisplayName: Onyx
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The modern single-target watch app. Without it the build is treated
        # as a legacy WatchKit extension host and will not launch.
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.onyx.health.michael.native
        # THE reason the app keeps running between sets. Paired with the
        # `HKWorkoutSession` in `WorkoutSessionController`; either without the
        # other is a no-op.
        WKBackgroundModes:
          - workout-processing
        # `WorkoutSessionController` asks to SHARE the workout type and to READ
        # heart rate and active energy. `requestAuthorization` traps without
        # both strings, and App Review rejects a generic one.
        NSHealthShareUsageDescription: >-
          Onyx reads your heart rate and active energy while you train so the
          set you are on can show what your heart is doing, and so the finished
          workout carries an average heart rate and a calorie figure.
        NSHealthUpdateUsageDescription: >-
          Onyx saves the strength workouts you log on your watch — their
          duration, active energy and heart rate — back to Apple Health, so the
          training you do here appears alongside the rest of your activity
          rings.

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.onyx.health.michael.native.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W9UMPV973P
        SWIFT_VERSION: "6.0"
        # Same rule as the phone: strict from day one, because retrofitting it
        # is what makes people give up on it.
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO

  # ── The watch's complications (W7) ───────────────────────────────────────
  #
  # Real WidgetKit on the wrist: one `StaticConfiguration` per wearable
  # `WidgetId`, drawn by `OnyxTile.accessory` — the SAME face the phone's Lock
  # Screen draws — from the `WatchTiles` the phone pushes inside the
  # application context and the watch app parks in the App Group suite.
  #
  # ── NO GRDB, AND THAT IS THE DESIGN ──────────────────────────────────────
  # OnyxCore and OnyxUI only. The watch's store holds sets and nothing else,
  # so there is no snapshot to build here, and an extension that opened the
  # watch's `onyx.sqlite` would be a second process on a WAL the app is
  # writing during a workout. The extension reads one JSON value out of
  # `UserDefaults` and draws it.
  OnyxWatchWidgets:
    type: app-extension
    platform: watchOS

    sources:
      - path: OnyxWatchWidgets
        excludes:
          - "Support/Info.plist"
          - "Support/OnyxWatchWidgets.entitlements"

    dependencies:
      - package: OnyxCore
        product: OnyxCore
      - package: OnyxUI
        product: OnyxUI

    entitlements:
      path: OnyxWatchWidgets/Support/OnyxWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.onyx.health.watch

    info:
      path: OnyxWatchWidgets/Support/Info.plist
      properties:
        CFBundleDisplayName: Onyx
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    settings:
      base:
        # The host's id with `.widgets` appended — the pairing is by name, as
        # the watch app's own is to the phone's.
        PRODUCT_BUNDLE_IDENTIFIER: app.onyx.health.michael.native.watchkitapp.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W9UMPV973P
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # ── The app's own tests ──────────────────────────────────────────────────
  #
  # Almost everything provable lives in OnyxCore and OnyxData, which test on
  # the command line in seconds with no simulator, no signing and no Xcode. This
  # target is for what genuinely cannot: `LoggerModel` is @MainActor, holds
  # @Observable view state, and enforces one rule with no home in the domain —
  # what happens to sets already logged when the prescription changes under them.
  OnyxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OnyxTests
    dependencies:
      - target: Onyx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.onyx.health.michael.native.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        # Hosted by the app, so `@testable import Onyx` can see it.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Onyx.app/Onyx"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  # ── The Watch scheme ──────────────────────────────────────────────────────
  # A target alone is not enough for `xcodebuild`: building `-target OnyxWatch`
  # skips the package-graph resolution its three package products need, and the
  # failure reads as four unrelated "unable to resolve module dependency" errors
  # from inside supabase-swift's own checkouts. A scheme is what makes the
  # watchOS build reproducible from the command line, which is what the ship
  # gate needs.
  OnyxWatch:
    build:
      targets:
        OnyxWatch: all
        OnyxWatchWidgets: all
    run:
      config: Debug

  Onyx:
    build:
      targets:
        Onyx: all
        OnyxWidgets: all
        OnyxWatch: all
        OnyxWatchWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      # The domain and store suites run from the command line with `swift test`
      # and do not need the app scheme. They are listed here so ⌘U in Xcode runs
      # everything, which is what a person actually expects it to do.
      targets:
        - OnyxTests
        - package: OnyxCore/OnyxCoreTests
        - package: OnyxData/OnyxDataTests
        - package: OnyxUI/OnyxUITests
