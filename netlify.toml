# Static-only site: the privacy policy, the support page and the Apple App Site
# Association file the native app's App Store listing points at. There is no
# build step — `site/` is published as-is — so a push costs no build minute.
[build]
  publish = "site"
  command = ""

# The AASA file is extensionless, so its content-type must be set explicitly
# (webcredentials → iOS Password AutoFill "Save Password" prompt).
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
